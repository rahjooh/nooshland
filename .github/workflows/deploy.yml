name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  DEPLOY_ENVIRONMENT_NAME: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}

jobs:
  quality-checks:
    name: Static analysis and build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run lint/type-check
        run: npm run lint

      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=2048" npm run build

  ssh-test:
    name: Verify SSH connectivity
    runs-on: ubuntu-latest
    needs: quality-checks
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.IP || vars.SSH_HOST || vars.IP }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.USER || vars.SSH_USER || vars.USERNAME || vars.USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.PASS || secrets.PASSWORD || vars.SSH_PASSWORD || vars.PASS || vars.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}

    steps:
      - name: Validate connection settings
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "::error::Missing SSH host. Please define a secret or variable such as SSH_HOST or IP." >&2
            exit 1
          fi
          if [ -z "${SSH_USER}" ]; then
            echo "::error::Missing SSH username. Please define a secret or variable such as SSH_USER or USER." >&2
            exit 1
          fi
          if [ -z "${SSH_PASSWORD}" ]; then
            echo "::error::Missing SSH password. Please define a secret or variable such as SSH_PASSWORD, PASS, or PASSWORD." >&2
            exit 1
          fi

      - name: Test SSH connection
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "SSH connection successful"

      - name: Ensure Nginx and PM2 are installed and configured
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -eu
            if [ -n "${BASH:-}" ]; then
              set -o pipefail
            fi

            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            # Install nginx if not present
            if ! command -v nginx >/dev/null 2>&1; then
              echo "Installing nginx..."
              $SUDO apt-get update
              $SUDO apt-get install -y nginx
            else
              echo "nginx is already installed"
            fi

            # Check and install Node.js 20 if not present or wrong version
            REQUIRED_NODE_VERSION="20"
            if command -v node >/dev/null 2>&1; then
              CURRENT_NODE_VERSION=$(node -v | sed 's/v//' | cut -d'.' -f1)
              if [ "$CURRENT_NODE_VERSION" != "$REQUIRED_NODE_VERSION" ]; then
                echo "Node.js version mismatch. Current: v${CURRENT_NODE_VERSION}.x, Required: v${REQUIRED_NODE_VERSION}.x"
                echo "Installing Node.js ${REQUIRED_NODE_VERSION}..."
                curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
                $SUDO apt-get install -y nodejs
              else
                echo "Node.js v${CURRENT_NODE_VERSION}.x is already installed (matches required v${REQUIRED_NODE_VERSION}.x)"
              fi
            else
              echo "Node.js is not installed. Installing Node.js ${REQUIRED_NODE_VERSION}..."
              curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
              $SUDO apt-get install -y nodejs
            fi

            # Verify Node.js installation
            NODE_VERSION=$(node -v)
            NPM_VERSION=$(npm -v || echo "not installed")
            echo "Node.js version: $NODE_VERSION"
            echo "npm version: $NPM_VERSION"

            # Install PM2 if not present
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2..."
              npm install -g pm2
            else
              echo "PM2 is already installed"
              pm2 --version || echo "PM2 version check failed"
            fi

            SITE_CONF="/etc/nginx/sites-available/nooshland-ir"
            SITE_LINK="/etc/nginx/sites-enabled/nooshland-ir"
            APP_DIR="$HOME/apps/nooshland.com"
            APP_PORT="3005"

            $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name nooshland.ir www.nooshland.ir;

                # Redirect HTTP to HTTPS
                return 301 https://\$host\$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name nooshland.ir www.nooshland.ir;

                ssl_certificate /etc/letsencrypt/live/nooshland.ir/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/nooshland.ir/privkey.pem;

                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
                ssl_prefer_server_ciphers off;

                # Proxy to Next.js app on port 3005
                location / {
                    proxy_pass http://localhost:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }

                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF

            $SUDO ln -sf "$SITE_CONF" "$SITE_LINK"

            if [ -e /etc/nginx/sites-enabled/default ]; then
              $SUDO rm -f /etc/nginx/sites-enabled/default
            fi

            $SUDO nginx -t
            $SUDO systemctl restart nginx

  deploy:
    name: Deploy to nooshland.ir
    runs-on: ubuntu-latest
    needs: ssh-test
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.IP || vars.SSH_HOST || vars.IP }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.USER || vars.SSH_USER || vars.USERNAME || vars.USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.PASS || secrets.PASSWORD || vars.SSH_PASSWORD || vars.PASS || vars.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Build failed - .next directory not found"
            exit 1
          fi
          echo "Build output verified: .next directory exists"

      - name: Prepare deployment archive
        run: |
          set -euo pipefail

          ARCHIVE_PATH="${RUNNER_TEMP}/deploy.tar.gz"

          # Create archive with built files and necessary config files
          # Build the base tar command
          TAR_ARGS=(
            czf "$ARCHIVE_PATH"
            --exclude='.git'
            --exclude='node_modules'
            --exclude='deploy.tar.gz'
            --exclude='deploy.tar.gz.*'
            --exclude='.next/cache'
            .next/
            package.json
            package-lock.json
            next.config.js
            tsconfig.json
            postcss.config.js
            tailwind.config.js
          )

          # Add public/ only if it exists
          if [ -d "public" ]; then
            TAR_ARGS+=(public/)
          fi

          tar "${TAR_ARGS[@]}"

          mv "$ARCHIVE_PATH" ./deploy.tar.gz
          echo "Deployment archive created successfully"

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload archive to server
        env:
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT="${SSH_PORT:-22}"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          REMOTE_DIR="~/deployments"
          ARCHIVE_NAME="deploy.tar.gz"
          REMOTE_PATH="$REMOTE_DIR/$ARCHIVE_NAME"
          RETRIES=5
          SLEEP_BETWEEN=10

          sshpass -p "$SSH_PASSWORD" \
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" "$REMOTE" "mkdir -p ${REMOTE_DIR}"

          for attempt in $(seq 1 "$RETRIES"); do
            echo "Uploading archive (attempt ${attempt}/${RETRIES})"
            if sshpass -p "$SSH_PASSWORD" \
              scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P "$SSH_PORT" "$ARCHIVE_NAME" "$REMOTE:$REMOTE_PATH"; then
              echo "Upload complete"
              exit 0
            fi

            if [ "$attempt" -lt "$RETRIES" ]; then
              echo "Upload failed, retrying in ${SLEEP_BETWEEN}s"
              sleep "$SLEEP_BETWEEN"
            else
              echo "::error::Failed to upload archive after ${RETRIES} attempts"
              exit 1
            fi
          done

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -eu
            if [ -n "${BASH:-}" ]; then
              set -o pipefail
            fi

            ARCHIVE_DIR="$HOME/deployments"
            ARCHIVE_NAME="deploy.tar.gz"
            ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"
            APP_DIR="$HOME/apps/nooshland.com"
            APP_PORT="3005"

            mkdir -p "$ARCHIVE_DIR"

            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            # Create app directory if it doesn't exist
            mkdir -p "$APP_DIR"
            
            # Extract archive to app directory
            tar -xzf "$ARCHIVE_PATH" -C "$APP_DIR"
            rm -f "$ARCHIVE_PATH"
            
            # Verify the .next directory exists
            if [ ! -d "$APP_DIR/.next" ]; then
              echo "Error: .next directory is missing after extraction"
              echo "APP_DIR contents:"
              ls -la "$APP_DIR" || true
              exit 1
            fi
            
            echo "Files extracted successfully to $APP_DIR"
            echo "Contents of app directory:"
            ls -la "$APP_DIR" | head -20 || true
            
            # Check Node.js version (should be 20)
            REQUIRED_NODE_VERSION="20"
            if command -v node >/dev/null 2>&1; then
              CURRENT_NODE_VERSION=$(node -v | sed 's/v//' | cut -d'.' -f1)
              if [ "$CURRENT_NODE_VERSION" != "$REQUIRED_NODE_VERSION" ]; then
                echo "WARNING: Node.js version mismatch. Current: v${CURRENT_NODE_VERSION}.x, Required: v${REQUIRED_NODE_VERSION}.x"
                echo "Installing Node.js ${REQUIRED_NODE_VERSION}..."
                curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
                $SUDO apt-get install -y nodejs
              else
                echo "✓ Node.js v${CURRENT_NODE_VERSION}.x is installed (matches required v${REQUIRED_NODE_VERSION}.x)"
              fi
            else
              echo "Node.js is not installed. Installing Node.js ${REQUIRED_NODE_VERSION}..."
              curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
              $SUDO apt-get install -y nodejs
            fi

            # Verify npm is available
            if ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: npm is not available. Node.js installation may have failed."
              exit 1
            fi

            NODE_VERSION=$(node -v)
            NPM_VERSION=$(npm -v)
            echo "Using Node.js: $NODE_VERSION, npm: $NPM_VERSION"
            
            # Install production dependencies
            cd "$APP_DIR"
            echo "Installing production dependencies..."
            echo "This may take a few minutes..."
            if ! npm ci --omit=dev --no-audit --progress=false; then
              echo "npm ci failed, trying npm install as fallback..."
              npm install --omit=dev --no-audit --progress=false
            fi
            echo "✓ Dependencies installed successfully"
            
            # Install PM2 if not already installed
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2..."
              npm install -g pm2
            else
              echo "PM2 is already installed"
            fi
            
            # Stop existing PM2 process if running
            pm2 stop nooshland || true
            pm2 delete nooshland || true
            
            # Start the application with PM2
            echo "Starting application with PM2 on port $APP_PORT..."
            PORT=$APP_PORT pm2 start npm --name "nooshland" -- start
            
            # Save PM2 configuration
            pm2 save
            
            # Setup PM2 to start on system boot
            pm2 startup || true
            
            # Get absolute paths
            ABS_APP_DIR="$(cd "$APP_DIR" && pwd)"
            
            # Update nginx config with proxy to port 3005
            SITE_CONF="/etc/nginx/sites-available/nooshland-ir"
            SITE_LINK="/etc/nginx/sites-enabled/nooshland-ir"
            
            echo "Creating/updating nginx config to proxy to port $APP_PORT"
            
            # Create nginx config
            $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name nooshland.ir www.nooshland.ir;
                return 301 https://\$host\$request_uri;
            }
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name nooshland.ir www.nooshland.ir;
                ssl_certificate /etc/letsencrypt/live/nooshland.ir/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/nooshland.ir/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
                ssl_prefer_server_ciphers off;
                location / {
                    proxy_pass http://localhost:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF
            
            # Remove leading whitespace from nginx config (12 spaces from heredoc indentation)
            $SUDO sed -i 's/^            //' "$SITE_CONF"

            # Enable the site
            $SUDO ln -sf "$SITE_CONF" "$SITE_LINK"
            
            echo "Nginx config created/updated. Proxying to port $APP_PORT"
            
            # Test nginx config
            if $SUDO nginx -t; then
              echo "✓ Nginx config test passed"
            else
              echo "ERROR: nginx config test failed!"
              $SUDO nginx -t
              exit 1
            fi
            
            # Reload nginx to apply changes
            if command -v nginx >/dev/null 2>&1; then
              if command -v systemctl >/dev/null 2>&1; then
                $SUDO systemctl reload nginx || $SUDO systemctl restart nginx || true
                echo "Nginx reloaded/restarted"
              else
                $SUDO nginx -s reload || $SUDO service nginx reload || true
                echo "Nginx reloaded"
              fi
            fi
            
            # Verify PM2 is running
            echo "=== PM2 Status ==="
            pm2 status
            pm2 info nooshland || true
            
            # Show PM2 logs (last 20 lines)
            echo "=== Recent PM2 Logs ==="
            pm2 logs nooshland --lines 20 --nostream || true
            
            # Verify the app is listening on port 3005
            echo "=== Port Check ==="
            if command -v netstat >/dev/null 2>&1; then
              netstat -tlnp | grep ":$APP_PORT " || echo "Port $APP_PORT not found in netstat"
            elif command -v ss >/dev/null 2>&1; then
              ss -tlnp | grep ":$APP_PORT " || echo "Port $APP_PORT not found in ss"
            else
              echo "Cannot check port status (netstat/ss not available)"
            fi
            
            echo "=== Deployment Complete ==="
            echo "Application should be running on port $APP_PORT"
            echo "Nginx should be proxying nooshland.ir to localhost:$APP_PORT"

name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  DEPLOY_ENVIRONMENT_NAME: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}

jobs:
  quality-checks:
    name: Static analysis and build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Try npm ci first (faster and more reliable)
          # If it fails due to lock file mismatch, fall back to npm install
          if ! npm ci --prefer-offline --no-audit; then
            echo "npm ci failed, lock file may be out of sync. Updating lock file..."
            npm install --no-audit
          fi

      - name: Run lint/type-check
        run: npm run lint

      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=2048" npm run build
        env:
          NODE_ENV: production
        # Note: Build uses optimized config:
        # - Source maps disabled (productionSourceMaps: false)
        # - Image optimization disabled (images.unoptimized: true)

  ssh-test:
    name: Verify SSH connectivity
    runs-on: ubuntu-latest
    needs: quality-checks
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.IP || vars.SSH_HOST || vars.IP }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.USER || vars.SSH_USER || vars.USERNAME || vars.USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.PASS || secrets.PASSWORD || vars.SSH_PASSWORD || vars.PASS || vars.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}

    steps:
      - name: Validate connection settings
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "::error::Missing SSH host. Please define a secret or variable such as SSH_HOST or IP." >&2
            exit 1
          fi
          if [ -z "${SSH_USER}" ]; then
            echo "::error::Missing SSH username. Please define a secret or variable such as SSH_USER or USER." >&2
            exit 1
          fi
          if [ -z "${SSH_PASSWORD}" ]; then
            echo "::error::Missing SSH password. Please define a secret or variable such as SSH_PASSWORD, PASS, or PASSWORD." >&2
            exit 1
          fi

      - name: Test SSH connection
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "SSH connection successful"

      - name: Ensure Nginx and PM2 are installed and configured
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -eu
            if [ -n "${BASH:-}" ]; then
              set -o pipefail
            fi

            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            # Install nginx if not present
            if ! command -v nginx >/dev/null 2>&1; then
              echo "Installing nginx..."
              $SUDO apt-get update
              $SUDO apt-get install -y nginx
            else
              echo "nginx is already installed"
            fi

            # Install SQLite3 if not present
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "Installing SQLite3..."
              $SUDO apt-get update
              $SUDO apt-get install -y sqlite3 libsqlite3-dev
            else
              echo "SQLite3 is already installed"
              sqlite3 --version
            fi

            # Install certbot for SSL certificate management
            if ! command -v certbot >/dev/null 2>&1; then
              echo "Installing certbot for SSL certificates..."
              $SUDO apt-get update
              $SUDO apt-get install -y certbot python3-certbot-nginx
            else
              echo "certbot is already installed"
              certbot --version || true
            fi

            # Check and install Node.js 20 if not present or wrong version
            REQUIRED_NODE_VERSION="20"
            if command -v node >/dev/null 2>&1; then
              CURRENT_NODE_VERSION=$(node -v | sed 's/v//' | cut -d'.' -f1)
              if [ "$CURRENT_NODE_VERSION" != "$REQUIRED_NODE_VERSION" ]; then
                echo "Node.js version mismatch. Current: v${CURRENT_NODE_VERSION}.x, Required: v${REQUIRED_NODE_VERSION}.x"
                echo "Installing Node.js ${REQUIRED_NODE_VERSION}..."
                curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
                $SUDO apt-get install -y nodejs
              else
                echo "Node.js v${CURRENT_NODE_VERSION}.x is already installed (matches required v${REQUIRED_NODE_VERSION}.x)"
              fi
            else
              echo "Node.js is not installed. Installing Node.js ${REQUIRED_NODE_VERSION}..."
              curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
              $SUDO apt-get install -y nodejs
            fi

            # Verify Node.js installation
            NODE_VERSION=$(node -v)
            NPM_VERSION=$(npm -v || echo "not installed")
            echo "Node.js version: $NODE_VERSION"
            echo "npm version: $NPM_VERSION"

            # Install PM2 if not present
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2..."
              npm install -g pm2
            else
              echo "PM2 is already installed"
              pm2 --version || echo "PM2 version check failed"
            fi

            SITE_CONF="/etc/nginx/sites-available/sphynx-ir"
            SITE_LINK="/etc/nginx/sites-enabled/sphynx-ir"
            APP_DIR="$HOME/apps/nooshland.com"
            APP_PORT="4001"
            
            # Check if SSL certificates exist
            SSL_CERT="/etc/letsencrypt/live/sphynx.ir/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/sphynx.ir/privkey.pem"
            HAS_SSL=false
            
            if [ -f "$SSL_CERT" ] && [ -f "$SSL_KEY" ]; then
              HAS_SSL=true
              echo "SSL certificates found, configuring HTTPS"
            else
              echo "SSL certificates not found, will attempt to obtain them"
            fi

            # Create nginx config based on SSL availability
            if [ "$HAS_SSL" = true ]; then
              $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name sphynx.ir www.sphynx.ir;
                # Redirect HTTP to HTTPS
                return 301 https://\$host\$request_uri;
            }
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name sphynx.ir www.sphynx.ir;
                ssl_certificate ${SSL_CERT};
                ssl_certificate_key ${SSL_KEY};
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
                ssl_prefer_server_ciphers off;
                # Proxy to Next.js app on port 4001
                location / {
                    proxy_pass http://localhost:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }
                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF
            else
              $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name sphynx.ir www.sphynx.ir;
                # Proxy to Next.js app on port 4001
                location / {
                    proxy_pass http://localhost:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                }
                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF
            fi

            $SUDO ln -sf "$SITE_CONF" "$SITE_LINK"

            if [ -e /etc/nginx/sites-enabled/default ]; then
              $SUDO rm -f /etc/nginx/sites-enabled/default
            fi

            # Before testing nginx, check and fix other configs with missing SSL certs
            echo "Checking for nginx configs with missing SSL certificates..."
            
            # Find all enabled nginx configs (except ours)
            for config_file in /etc/nginx/sites-enabled/*; do
              if [ -f "$config_file" ] && [ "$(basename "$config_file")" != "sphynx-ir" ]; then
                # Check if config references SSL certs that don't exist
                if grep -q "ssl_certificate" "$config_file" 2>/dev/null; then
                  SSL_CERT_PATH=$(grep "ssl_certificate" "$config_file" | head -1 | awk '{print $2}' | tr -d ';' || true)
                  if [ -n "$SSL_CERT_PATH" ] && [ ! -f "$SSL_CERT_PATH" ]; then
                    echo "WARNING: Found config with missing SSL cert: $config_file"
                    echo "Temporarily disabling to allow nginx to start..."
                    $SUDO rm -f "$config_file"
                    echo "Disabled: $config_file"
                  fi
                fi
              fi
            done

            # Test nginx config - handle errors from other configs gracefully
            # Other sites might have missing SSL certs (now disabled above)
            echo "Testing nginx configuration..."
            if $SUDO nginx -t 2>&1 | tee /tmp/nginx-test.log; then
              echo "✓ Nginx config test passed"
            else
              # Check if the error is about our config or another config
              if grep -q "sphynx.ir" /tmp/nginx-test.log; then
                echo "ERROR: nginx config test failed for sphynx.ir!"
                cat /tmp/nginx-test.log
                exit 1
              else
                echo "WARNING: nginx config test failed, but error is not related to sphynx.ir"
                echo "This might be due to other site configs with missing SSL certificates"
                echo "Our sphynx.ir config should still work. Continuing..."
                cat /tmp/nginx-test.log || true
              fi
            fi
            
            # Try to reload/restart nginx (might fail if other configs are broken)
            echo "Attempting to reload nginx..."
            if $SUDO systemctl reload nginx 2>&1 || $SUDO systemctl restart nginx 2>&1; then
              echo "✓ Nginx reloaded/restarted successfully"
              
              # Now attempt to obtain SSL certificates if they don't exist
              if [ "$HAS_SSL" = false ]; then
                echo "Attempting to obtain SSL certificates for sphynx.ir..."
                # Use certbot with nginx plugin to automatically configure SSL
                # --non-interactive: Don't prompt for user input
                # --agree-tos: Agree to terms of service
                # --email: Use a default email (can be overridden with environment variable)
                # --redirect: Automatically redirect HTTP to HTTPS
                if $SUDO certbot --nginx \
                  --non-interactive \
                  --agree-tos \
                  --email admin@sphynx.ir \
                  --redirect \
                  -d sphynx.ir \
                  -d www.sphynx.ir 2>&1; then
                  echo "✓ SSL certificates obtained and configured successfully"
                  HAS_SSL=true
                  
                  # Reload nginx to apply SSL configuration
                  $SUDO systemctl reload nginx || $SUDO systemctl restart nginx || true
                else
                  echo "WARNING: Failed to obtain SSL certificates"
                  echo "This might be due to:"
                  echo "  - Domain DNS not pointing to this server"
                  echo "  - Port 80 not accessible from internet"
                  echo "  - Rate limiting from Let's Encrypt"
                  echo "Continuing with HTTP-only configuration..."
                fi
              fi
            else
              echo "WARNING: Could not reload/restart nginx"
              echo "This might be due to other site configurations"
              echo "The sphynx.ir config will be applied during deployment"
            fi

  deploy:
    name: Deploy to sphynx.ir
    runs-on: ubuntu-latest
    needs: ssh-test
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT_NAME || vars.DEPLOY_ENV || 'host' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.IP || vars.SSH_HOST || vars.IP }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.USER || vars.SSH_USER || vars.USERNAME || vars.USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.PASS || secrets.PASSWORD || vars.SSH_PASSWORD || vars.PASS || vars.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Try npm ci first (faster and more reliable)
          # If it fails due to lock file mismatch, fall back to npm install
          if ! npm ci --prefer-offline --no-audit; then
            echo "npm ci failed, lock file may be out of sync. Updating lock file..."
            npm install --no-audit
          fi

      - name: Build project
        run: |
          echo "Building Next.js application in standalone mode..."
          NODE_OPTIONS="--max-old-space-size=2048" npm run build
          
          # Verify standalone build was created
          if [ ! -d ".next/standalone" ]; then
            echo "::error::Standalone build directory not found after build"
            echo "Build output:"
            ls -la .next/ || true
            exit 1
          fi
          
          # Verify static files were generated
          if [ ! -d ".next/static" ]; then
            echo "::error::Static files directory not found after build"
            exit 1
          fi
          
          # Check for CSS files in static directory
          echo "Checking for CSS files in build output..."
          BUILD_ID_FILE=".next/standalone/.next/BUILD_ID"
          if [ -f "$BUILD_ID_FILE" ]; then
            BUILD_ID=$(cat "$BUILD_ID_FILE" 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "$BUILD_ID" ]; then
              echo "Build ID: $BUILD_ID"
              
              # Check if CSS files exist in .next/static
              if [ -d ".next/static/$BUILD_ID/css" ]; then
                CSS_COUNT=$(ls ".next/static/$BUILD_ID/css" 2>/dev/null | wc -l)
                echo "✓ Found $CSS_COUNT CSS files in .next/static/$BUILD_ID/css"
                ls ".next/static/$BUILD_ID/css" | head -5 || true
              else
                echo "WARNING: No CSS directory found in .next/static/$BUILD_ID/"
                echo "Checking what's in .next/static:"
                ls -la ".next/static" | head -10 || true
                
                # Check if CSS files are in standalone/.next/static
                if [ -d ".next/standalone/.next/static/$BUILD_ID/css" ]; then
                  echo "Found CSS files in standalone/.next/static, copying to .next/static..."
                  mkdir -p ".next/static/$BUILD_ID"
                  cp -r ".next/standalone/.next/static/$BUILD_ID/css" ".next/static/$BUILD_ID/css"
                  echo "✓ CSS files copied to .next/static/$BUILD_ID/css"
                else
                  echo "ERROR: CSS files not found in either location!"
                  echo "This will cause styling issues. Checking standalone structure:"
                  find ".next/standalone/.next" -name "*.css" 2>/dev/null | head -5 || true
                fi
              fi
            fi
          else
            echo "WARNING: BUILD_ID file not found, cannot verify CSS files"
          fi
          
          # Check if node_modules exists in standalone
          if [ ! -d ".next/standalone/node_modules" ]; then
            echo "::error::node_modules not found in standalone build"
            echo "Standalone directory contents:"
            ls -la .next/standalone/ || true
            echo ""
            echo "This usually means the build didn't complete properly."
            echo "Trying to diagnose..."
            
            # Check if server.js exists
            if [ -f ".next/standalone/server.js" ]; then
              echo "server.js exists, but node_modules is missing"
              echo "This might be a Next.js standalone build issue"
            fi
            
            # List what's actually in standalone
            echo "Contents of .next/standalone:"
            find .next/standalone -maxdepth 2 -type f -o -type d | head -20 || true
            
            exit 1
          fi
          
          echo "✓ Standalone build created successfully with node_modules"
        env:
          NODE_ENV: production
        # Performance optimizations applied:
        # - Source maps disabled (reduces memory)
        # - Image optimization disabled (reduces CPU/RAM)
        # - Lower memory allocation for build (optimized config)

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Build failed - .next directory not found"
            exit 1
          fi
          if [ ! -d ".next/standalone" ]; then
            echo "::error::Standalone build not found - check next.config.js has output: 'standalone'"
            exit 1
          fi
          
          # Verify standalone build contains necessary files
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "::error::server.js not found in standalone build"
            exit 1
          fi
          
          if [ ! -d ".next/standalone/node_modules" ]; then
            echo "::error::node_modules not found in standalone build"
            exit 1
          fi
          
          if [ ! -d ".next/standalone/node_modules/next" ]; then
            echo "::error::'next' module not found in standalone/node_modules"
            echo "Available modules:"
            ls ".next/standalone/node_modules" | head -20 || true
            exit 1
          fi
          
          echo "✓ Build output verified: .next/standalone directory exists with all dependencies"
          echo "  - server.js: exists"
          echo "  - node_modules: exists"
          echo "  - next module: exists"

      - name: Prepare standalone deployment archive
        run: |
          set -euo pipefail

          ARCHIVE_PATH="${RUNNER_TEMP}/deploy.tar.gz"

          # Create archive with standalone build files
          # Next.js standalone structure:
          # - .next/standalone/ contains server.js, node_modules, and .next/ subdirectory
          # - .next/static/ contains static assets (must be at same level as standalone)
          # - public/ contains public assets
          # - data/ for SQLite database
          echo "Creating optimized standalone deployment archive..."
          
          # Verify standalone structure
          if [ ! -d ".next/standalone" ]; then
            echo "Error: .next/standalone directory not found"
            exit 1
          fi
          
          if [ ! -d ".next/static" ]; then
            echo "Error: .next/static directory not found"
            exit 1
          fi
          
          # Verify static files structure before archiving
          echo "Verifying static files structure..."
          BUILD_ID_FILE=".next/standalone/.next/BUILD_ID"
          if [ -f "$BUILD_ID_FILE" ]; then
            CURRENT_BUILD_ID=$(cat "$BUILD_ID_FILE" 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "$CURRENT_BUILD_ID" ]; then
              echo "Current build ID: $CURRENT_BUILD_ID"
              
              # Check if CSS files exist in the expected location
              if [ -d ".next/static/$CURRENT_BUILD_ID/css" ]; then
                CSS_COUNT=$(ls ".next/static/$CURRENT_BUILD_ID/css" 2>/dev/null | wc -l)
                echo "✓ Found $CSS_COUNT CSS files in .next/static/$CURRENT_BUILD_ID/css"
              elif [ -d ".next/standalone/.next/static/$CURRENT_BUILD_ID/css" ]; then
                echo "WARNING: CSS files found in standalone/.next/static instead of .next/static"
                echo "Copying CSS files to correct location..."
                mkdir -p ".next/static/$CURRENT_BUILD_ID"
                cp -r ".next/standalone/.next/static/$CURRENT_BUILD_ID/css" ".next/static/$CURRENT_BUILD_ID/css" || true
                echo "✓ CSS files copied to .next/static/$CURRENT_BUILD_ID/css"
              else
                echo "WARNING: No CSS files found for build ID $CURRENT_BUILD_ID"
                echo "This might cause styling issues"
                echo "Checking what's in static directory:"
                ls -la ".next/static" | head -10 || true
              fi
            fi
          fi
          
          # Archive standalone build files
          # Important: Include .next/standalone/node_modules (should contain all dependencies)
          # and .next/static for static assets
          echo "Creating archive with standalone build..."
          echo "Verifying files to archive:"
          ls -la .next/standalone/ | head -10 || true
          
          # Verify node_modules exists before archiving
          if [ ! -d ".next/standalone/node_modules" ]; then
            echo "::error::node_modules not found in .next/standalone before archiving"
            exit 1
          fi
          
          # Check if node_modules is a symlink or directory
          echo "Checking node_modules type:"
          ls -ld .next/standalone/node_modules || true
          
          # Check size of node_modules
          echo "node_modules size:"
          du -sh .next/standalone/node_modules || true
          
          # Create data directory structure (for SQLite)
          mkdir -p data
          
          # Create archive - include entire directories to preserve structure
          # Next.js standalone needs:
          # - .next/standalone/ (complete directory with all contents)
          # - .next/static/ (at same level as standalone)
          # - public/ (if exists, at root level)
          # - data/ (for SQLite)
          echo "Creating archive (this may take a moment if node_modules is large)..."
          echo "Archiving complete directories to preserve structure..."
          
          # Archive entire directories to ensure structure is preserved correctly
          if [ -d "public" ]; then
            echo "Including public directory in archive"
            tar czf "$ARCHIVE_PATH" \
              --dereference \
              --exclude='.git' \
              --exclude='deploy.tar.gz' \
              --exclude='deploy.tar.gz.*' \
              --exclude='.next/cache' \
              --exclude='node_modules/.cache' \
              --exclude='.next/standalone/.next/cache' \
              .next/standalone/ \
              .next/static/ \
              public/ \
              data/ 2>&1 | tee /tmp/tar-output.log || {
              echo "::error::tar command failed"
              cat /tmp/tar-output.log || true
              exit 1
            }
          else
            echo "No public directory, creating archive without it"
            tar czf "$ARCHIVE_PATH" \
              --dereference \
              --exclude='.git' \
              --exclude='deploy.tar.gz' \
              --exclude='deploy.tar.gz.*' \
              --exclude='.next/cache' \
              --exclude='node_modules/.cache' \
              --exclude='.next/standalone/.next/cache' \
              .next/standalone/ \
              .next/static/ \
              data/ 2>&1 | tee /tmp/tar-output.log || {
              echo "::error::tar command failed"
              cat /tmp/tar-output.log || true
              exit 1
            }
          fi
          
          echo "Archive created, checking size..."
          ARCHIVE_SIZE_BYTES=$(stat -f%z "$ARCHIVE_PATH" 2>/dev/null || stat -c%s "$ARCHIVE_PATH" 2>/dev/null || echo "unknown")
          echo "Archive size: $ARCHIVE_SIZE_BYTES bytes"
          
          if [ "$ARCHIVE_SIZE_BYTES" != "unknown" ] && [ "$ARCHIVE_SIZE_BYTES" -lt 10000000 ]; then
            echo "::warning::Archive seems too small (less than 10MB), node_modules might not be included"
          fi
          
          echo "Verifying archive..."

          mv "$ARCHIVE_PATH" ./deploy.tar.gz
          
          # Show archive size
          ARCHIVE_SIZE=$(du -h deploy.tar.gz | cut -f1)
          echo "Deployment archive created successfully (Size: $ARCHIVE_SIZE)"
          
          # Verify archive contents - check for node_modules
          echo "Verifying archive structure..."
          echo "Checking for node_modules in archive:"
          
          # Check if node_modules directory exists - use a simple test
          # Extract first few entries to a temp file to avoid pipe issues
          TEMP_LIST=$(mktemp)
          tar -tzf deploy.tar.gz 2>/dev/null | head -50 > "$TEMP_LIST" || true
          
          # Check if node_modules exists in the first 50 entries
          if grep -q "node_modules" "$TEMP_LIST" 2>/dev/null; then
            echo "✓ node_modules found in archive"
            echo "Sample node_modules entries:"
            grep "node_modules" "$TEMP_LIST" | head -5 || true
            rm -f "$TEMP_LIST"
          else
            echo "Checking full archive listing..."
            # If not in first 50, check more entries
            tar -tzf deploy.tar.gz 2>/dev/null | head -200 > "$TEMP_LIST" || true
            if grep -q "node_modules" "$TEMP_LIST" 2>/dev/null; then
              echo "✓ node_modules found in archive (after checking more entries)"
              grep "node_modules" "$TEMP_LIST" | head -5 || true
              rm -f "$TEMP_LIST"
            else
              echo "::error::node_modules NOT found in archive!"
              echo "Archive contents (first 30 entries):"
              head -30 "$TEMP_LIST" || true
              rm -f "$TEMP_LIST"
              exit 1
            fi
          fi
          
          # Check for next module specifically
          TEMP_LIST2=$(mktemp)
          tar -tzf deploy.tar.gz 2>/dev/null | head -200 > "$TEMP_LIST2" || true
          if grep -qE "(node_modules/next|node_modules/@next)" "$TEMP_LIST2" 2>/dev/null; then
            echo "✓ next module found in archive"
            rm -f "$TEMP_LIST2"
          else
            echo "Checking for next module (alternative patterns)..."
            if grep -q "next" "$TEMP_LIST2" 2>/dev/null; then
              echo "✓ next-related module found in archive"
              grep "next" "$TEMP_LIST2" | head -3 || true
              rm -f "$TEMP_LIST2"
            else
              echo "::error::next module NOT found in archive!"
              echo "Available top-level modules in node_modules:"
              tar -tzf deploy.tar.gz 2>/dev/null | grep "node_modules/[^/]*$" | head -20 || true
              rm -f "$TEMP_LIST2"
              exit 1
            fi
          fi

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload archive to server
        env:
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT="${SSH_PORT:-22}"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          REMOTE_DIR="~/deployments"
          ARCHIVE_NAME="deploy.tar.gz"
          REMOTE_PATH="$REMOTE_DIR/$ARCHIVE_NAME"
          RETRIES=5
          SLEEP_BETWEEN=10

          sshpass -p "$SSH_PASSWORD" \
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" "$REMOTE" "mkdir -p ${REMOTE_DIR}"

          for attempt in $(seq 1 "$RETRIES"); do
            echo "Uploading archive (attempt ${attempt}/${RETRIES})"
            if sshpass -p "$SSH_PASSWORD" \
              scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P "$SSH_PORT" "$ARCHIVE_NAME" "$REMOTE:$REMOTE_PATH"; then
              echo "Upload complete"
              exit 0
            fi

            if [ "$attempt" -lt "$RETRIES" ]; then
              echo "Upload failed, retrying in ${SLEEP_BETWEEN}s"
              sleep "$SLEEP_BETWEEN"
            else
              echo "::error::Failed to upload archive after ${RETRIES} attempts"
              exit 1
            fi
          done

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -eu
            if [ -n "${BASH:-}" ]; then
              set -o pipefail
            fi

            ARCHIVE_DIR="$HOME/deployments"
            ARCHIVE_NAME="deploy.tar.gz"
            ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"
            APP_DIR="$HOME/apps/nooshland.com"
            APP_PORT="4001"

            mkdir -p "$ARCHIVE_DIR"

            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              SUDO=""
            fi

            # Create app directory if it doesn't exist
            mkdir -p "$APP_DIR"
            
            # Extract standalone archive to app directory
            echo "Extracting standalone build..."
            tar -xzf "$ARCHIVE_PATH" -C "$APP_DIR"
            rm -f "$ARCHIVE_PATH"
            
            # Note: We extract .next/static/ which may contain multiple build IDs
            # Next.js will use the build ID from the standalone build's .next directory
            # The static files should match the build ID in standalone/.next/BUILD_ID
            
            # Verify standalone build structure
            STANDALONE_DIR="$APP_DIR/.next/standalone"
            STATIC_DIR="$APP_DIR/.next/static"
            
            # Debug: Check what's actually in the static directory
            echo "Checking static directory structure..."
            if [ -d "$STATIC_DIR" ]; then
              echo "Static directory contents:"
              ls -la "$STATIC_DIR" | head -15 || true
              
              # Get build ID and check its structure
              BUILD_ID_FILE="$STANDALONE_DIR/.next/BUILD_ID"
              if [ -f "$BUILD_ID_FILE" ]; then
                CURRENT_BUILD_ID=$(cat "$BUILD_ID_FILE" 2>/dev/null | tr -d '[:space:]' || echo "")
                if [ -n "$CURRENT_BUILD_ID" ]; then
                  echo "Build ID: $CURRENT_BUILD_ID"
                  if [ -d "$STATIC_DIR/$CURRENT_BUILD_ID" ]; then
                    echo "Build ID directory contents:"
                    ls -la "$STATIC_DIR/$CURRENT_BUILD_ID" | head -10 || true
                    
                    # Check if CSS files exist in the standalone build's .next directory
                    # Sometimes CSS files are in .next/standalone/.next/static instead
                    STANDALONE_STATIC="$STANDALONE_DIR/.next/static"
                    if [ -d "$STANDALONE_STATIC" ]; then
                      echo "Checking standalone .next/static directory..."
                      if [ -d "$STANDALONE_STATIC/$CURRENT_BUILD_ID/css" ]; then
                        echo "Found CSS files in standalone build, copying to static directory..."
                        mkdir -p "$STATIC_DIR/$CURRENT_BUILD_ID"
                        cp -r "$STANDALONE_STATIC/$CURRENT_BUILD_ID/css" "$STATIC_DIR/$CURRENT_BUILD_ID/css" || true
                        echo "✓ CSS files copied to $STATIC_DIR/$CURRENT_BUILD_ID/css"
                      fi
                      if [ -d "$STANDALONE_STATIC/$CURRENT_BUILD_ID/chunks" ]; then
                        echo "Found chunks in standalone build, copying to static directory..."
                        mkdir -p "$STATIC_DIR/$CURRENT_BUILD_ID"
                        cp -r "$STANDALONE_STATIC/$CURRENT_BUILD_ID/chunks" "$STATIC_DIR/$CURRENT_BUILD_ID/chunks" || true
                        echo "✓ Chunks copied to $STATIC_DIR/$CURRENT_BUILD_ID/chunks"
                      fi
                    fi
                  else
                    echo "WARNING: Build ID directory not found: $STATIC_DIR/$CURRENT_BUILD_ID"
                  fi
                fi
              fi
            fi
            
            # Verify standalone build structure
            STANDALONE_DIR="$APP_DIR/.next/standalone"
            STATIC_DIR="$APP_DIR/.next/static"
            
            if [ ! -d "$STANDALONE_DIR" ]; then
              echo "Error: Standalone build directory is missing after extraction"
              echo "APP_DIR contents:"
              ls -la "$APP_DIR" || true
              exit 1
            fi
            
            if [ ! -d "$STATIC_DIR" ]; then
              echo "Error: Static assets directory is missing after extraction"
              exit 1
            fi
            
            # Verify static directory has content
            if [ -z "$(ls -A $STATIC_DIR 2>/dev/null)" ]; then
              echo "ERROR: Static directory is empty!"
              echo "This will cause CSS/JS files not to load"
              exit 1
            fi
            
            echo "✓ Static directory verified with content"
            STATIC_FILE_COUNT=$(find "$STATIC_DIR" -type f 2>/dev/null | wc -l)
            echo "  Static files found: $STATIC_FILE_COUNT files"
            echo "  Static directory structure:"
            ls -la "$STATIC_DIR" | head -10 || true
            echo "  Sample static files:"
            find "$STATIC_DIR" -type f | head -5 || true
            
            # Check for CSS files specifically
            if [ -d "$STATIC_DIR/css" ]; then
              echo "  CSS files found: $(ls "$STATIC_DIR/css" | wc -l) files"
              echo "  Sample CSS files:"
              ls "$STATIC_DIR/css" | head -3 || true
            else
              echo "  WARNING: CSS directory not found in static"
            fi
            
            # Verify server.js exists in standalone
            if [ ! -f "$STANDALONE_DIR/server.js" ]; then
              echo "Error: server.js not found in standalone build"
              echo "Standalone directory contents:"
              ls -la "$STANDALONE_DIR" | head -10 || true
              exit 1
            fi
            
            # Verify node_modules exists in standalone (should contain all dependencies including 'next')
            if [ ! -d "$STANDALONE_DIR/node_modules" ]; then
              echo "ERROR: node_modules not found in standalone build"
              echo "This will cause module resolution failures"
              echo "Standalone directory contents:"
              ls -la "$STANDALONE_DIR" || true
              exit 1
            fi
            
            # Verify 'next' module exists
            if [ ! -d "$STANDALONE_DIR/node_modules/next" ]; then
              echo "ERROR: 'next' module not found in standalone/node_modules"
              echo "Available modules:"
              ls "$STANDALONE_DIR/node_modules" | head -20 || true
              exit 1
            fi
            
            echo "✓ Standalone build extracted successfully"
            echo "Directory structure verified:"
            echo "  - Standalone: $STANDALONE_DIR"
            echo "  - Static: $STATIC_DIR"
            echo "  - Server.js: $STANDALONE_DIR/server.js"
            echo "  - node_modules: $STANDALONE_DIR/node_modules (exists)"
            echo "  - next module: $STANDALONE_DIR/node_modules/next (exists)"
            
            # Check Node.js version (should be 20)
            REQUIRED_NODE_VERSION="20"
            if command -v node >/dev/null 2>&1; then
              CURRENT_NODE_VERSION=$(node -v | sed 's/v//' | cut -d'.' -f1)
              if [ "$CURRENT_NODE_VERSION" != "$REQUIRED_NODE_VERSION" ]; then
                echo "WARNING: Node.js version mismatch. Current: v${CURRENT_NODE_VERSION}.x, Required: v${REQUIRED_NODE_VERSION}.x"
                echo "Installing Node.js ${REQUIRED_NODE_VERSION}..."
                curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
                $SUDO apt-get install -y nodejs
              else
                echo "✓ Node.js v${CURRENT_NODE_VERSION}.x is installed (matches required v${REQUIRED_NODE_VERSION}.x)"
              fi
            else
              echo "Node.js is not installed. Installing Node.js ${REQUIRED_NODE_VERSION}..."
              curl -fsSL https://deb.nodesource.com/setup_${REQUIRED_NODE_VERSION}.x | $SUDO bash -
              $SUDO apt-get install -y nodejs
            fi

            NODE_VERSION=$(node -v)
            echo "Using Node.js: $NODE_VERSION"
            echo ""
            echo "✓ NO npm install needed - using standalone build (all dependencies included)"
            
            # Create data directory if it doesn't exist (for SQLite)
            mkdir -p "$APP_DIR/data"
            
            # Database will be auto-initialized on first API call via lib/db.ts
            # which automatically runs migrations on import
            echo "Database will be auto-initialized on first API call"
            
            # Install certbot for SSL certificate management (if not already installed)
            if ! command -v certbot >/dev/null 2>&1; then
              echo "Installing certbot for SSL certificates..."
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                SUDO=""
              fi
              $SUDO apt-get update
              $SUDO apt-get install -y certbot python3-certbot-nginx
            else
              echo "certbot is already installed"
            fi
            
            # Install PM2 if not already installed
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2..."
              npm install -g pm2
            else
              echo "PM2 is already installed"
            fi
            
            # Stop existing PM2 process if running
            pm2 stop nooshland || true
            pm2 delete nooshland || true
            
            # Start the application with PM2 using standalone mode
            # Performance optimizations applied:
            # - Using standalone build (no npm install needed, minimal footprint ~150-200MB RAM)
            # - Direct node execution (no npm overhead)
            # - Set max memory restart to 400MB (auto-restart on memory issues)
            # - Source maps disabled in production (reduces memory consumption)
            # - Image optimization disabled (reduces CPU/RAM usage)
            echo "Starting application with PM2 using standalone build..."
            echo "Performance optimizations: Standalone mode, no npm install, 400MB memory limit"
            
            # Standalone structure:
            # - .next/standalone/ contains server.js and node_modules
            # - .next/static/ contains static assets (needs to be accessible)
            # - public/ contains public assets (needs to be accessible)
            # The standalone server.js automatically handles these paths
            # But we need to ensure it can find them by setting the working directory correctly
            
            # Verify the directory structure is correct
            echo "Verifying standalone directory structure..."
            echo "Standalone dir: $STANDALONE_DIR"
            echo "Static dir: $STATIC_DIR"
            echo "App dir: $APP_DIR"
            
            # Verify static directory exists and is accessible
            if [ ! -d "$STATIC_DIR" ]; then
              echo "ERROR: Static directory missing at $STATIC_DIR"
              exit 1
            fi
            
            # Verify the structure: from standalone, static should be at ../static
            cd "$STANDALONE_DIR"
            if [ ! -d "../static" ]; then
              echo "ERROR: Static directory not accessible from standalone directory"
              echo "Expected: $STANDALONE_DIR/../static"
              echo "Actual structure:"
              ls -la .. || true
              exit 1
            fi
            
            # Get the build ID from the standalone build to verify static files match
            # The build ID is stored in .next/standalone/.next/BUILD_ID
            BUILD_ID_FILE="$STANDALONE_DIR/.next/BUILD_ID"
            if [ -f "$BUILD_ID_FILE" ]; then
              CURRENT_BUILD_ID=$(cat "$BUILD_ID_FILE" 2>/dev/null | tr -d '[:space:]' || echo "")
              if [ -n "$CURRENT_BUILD_ID" ]; then
                echo "Current build ID from standalone: $CURRENT_BUILD_ID"
                
                # Verify this build ID exists in static directory
                if [ -d "$STATIC_DIR/$CURRENT_BUILD_ID" ]; then
                  echo "✓ Static files found for current build ID: $CURRENT_BUILD_ID"
                  
                  # Check what's inside the build ID directory
                  echo "  Contents of build ID directory:"
                  ls -la "$STATIC_DIR/$CURRENT_BUILD_ID" | head -10 || true
                  
                  # Check if CSS files are in the build ID directory or at root
                  if [ -d "$STATIC_DIR/$CURRENT_BUILD_ID/css" ]; then
                    echo "  ✓ CSS directory found in build ID folder"
                  elif [ -d "$STATIC_DIR/css" ]; then
                    echo "  WARNING: CSS directory is at root of static, not in build ID folder"
                    echo "  This suggests a build structure mismatch"
                    echo "  CSS files at: $STATIC_DIR/css"
                    echo "  Expected at: $STATIC_DIR/$CURRENT_BUILD_ID/css"
                  else
                    echo "  WARNING: No CSS directory found"
                  fi
                else
                  echo "WARNING: Static files for build ID '$CURRENT_BUILD_ID' not found in static directory"
                  echo "Available build IDs in static:"
                  ls -d "$STATIC_DIR"/*/ 2>/dev/null | xargs -n1 basename | grep -v '^css$' | grep -v '^chunks$' || echo "  (none found)"
                  echo "This might cause 404 errors for static assets"
                fi
              fi
            else
              echo "Note: BUILD_ID file not found at $BUILD_ID_FILE"
              echo "Next.js will determine build ID at runtime"
            fi
            
            # Verify public directory if it exists
            if [ -d "$APP_DIR/public" ]; then
              echo "✓ Public directory found"
            else
              echo "Note: Public directory not found (this is OK if not using public assets)"
            fi
            
            echo "✓ Directory structure verified"
            echo "  - Standalone: $STANDALONE_DIR"
            echo "  - Static (from standalone): ../static"
            echo "  - Server.js: $STANDALONE_DIR/server.js"
            
            # Start with PM2 using standalone server.js
            # Standalone mode: all dependencies are bundled, no npm install needed
            # Set working directory to standalone, but ensure paths are correct
            # Next.js standalone server.js will automatically find ../static and ../../public
            # We need to ensure the server can find static files relative to its location
            echo "Starting Next.js standalone server..."
            echo "Working directory will be: $STANDALONE_DIR"
            echo "Static files should be at: $STANDALONE_DIR/../static"
            echo "Public files should be at: $APP_DIR/public"
            
            # Verify static files exist before starting
            echo "Checking static files..."
            if [ -d "$STATIC_DIR" ] && [ "$(ls -A $STATIC_DIR 2>/dev/null)" ]; then
              echo "✓ Static directory has content"
              echo "  Sample files: $(ls $STATIC_DIR | head -3 | tr '\n' ' ')"
            else
              echo "ERROR: Static directory is empty or missing!"
              exit 1
            fi
            
            # Start the server with explicit environment variables
            # Next.js standalone mode needs to know where to find static files
            PORT=$APP_PORT \
            NODE_ENV=production \
            pm2 start server.js \
              --name "nooshland" \
              --max-memory-restart 400M \
              --node-args="--max-old-space-size=400" \
              --update-env \
              --cwd "$STANDALONE_DIR"
            
            # Wait a moment for the server to start
            echo "Waiting for server to start..."
            sleep 5
            
            # Verify the server is responding
            echo "Verifying server is responding..."
            for i in {1..10}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT/ 2>/dev/null | grep -q "200"; then
                echo "✓ Server is responding on port $APP_PORT"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "ERROR: Server is not responding after 10 attempts"
                echo "PM2 status:"
                pm2 status
                echo "PM2 logs:"
                pm2 logs nooshland --lines 30 --nostream || true
                exit 1
              fi
              sleep 1
            done
            
            # Test if static assets are accessible
            echo "Testing static assets accessibility..."
            STATIC_TEST=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT/_next/static 2>/dev/null || echo "000")
            echo "Static assets endpoint returned: HTTP $STATIC_TEST"
            
            # Try to access a specific static file - need to use correct build ID
            # Next.js static files are organized as: /_next/static/{buildId}/css/{file}
            echo "Finding build ID from HTML and testing static file access..."
            HOME_HTML=$(curl -s http://localhost:$APP_PORT/ 2>/dev/null || echo "")
            if [ -n "$HOME_HTML" ]; then
              # Extract build ID from HTML (look for _next/static/{buildId}/)
              BUILD_ID=$(echo "$HOME_HTML" | grep -o '_next/static/[^/]*' | head -1 | sed 's|_next/static/||' || echo "")
              if [ -n "$BUILD_ID" ]; then
                echo "  Build ID from HTML: $BUILD_ID"
                
                # Check if this build ID exists in static directory
                if [ -d "$STATIC_DIR/$BUILD_ID" ]; then
                  echo "  ✓ Build ID directory exists in static folder"
                  
                  # Try to find a CSS file in this build
                  if [ -d "$STATIC_DIR/$BUILD_ID/css" ]; then
                    CSS_FILE=$(ls "$STATIC_DIR/$BUILD_ID/css" 2>/dev/null | head -1)
                    if [ -n "$CSS_FILE" ]; then
                      CSS_PATH="/_next/static/$BUILD_ID/css/$CSS_FILE"
                      echo "  Testing CSS file: $CSS_PATH"
                      CSS_TEST=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$APP_PORT$CSS_PATH" 2>/dev/null || echo "000")
                      echo "  CSS file accessibility: HTTP $CSS_TEST"
                      if [ "$CSS_TEST" = "200" ]; then
                        echo "  ✓ CSS file is accessible - styling should work"
                      else
                        echo "  ERROR: CSS file not accessible (HTTP $CSS_TEST)"
                        echo "  This will cause the page to appear unstyled"
                        echo "  File exists: $STATIC_DIR/$BUILD_ID/css/$CSS_FILE"
                        echo "  But server returns 404 for: $CSS_PATH"
                      fi
                    fi
                  else
                    echo "  WARNING: CSS directory not found for build ID $BUILD_ID"
                  fi
                else
                  echo "  ERROR: Build ID directory not found in static folder!"
                  echo "  HTML references build ID: $BUILD_ID"
                  echo "  But static directory has: $(ls $STATIC_DIR | grep -v '^css$' | grep -v '^chunks$' | tr '\n' ' ')"
                  echo "  This suggests a build mismatch - static files don't match the HTML"
                fi
              else
                echo "  WARNING: Could not extract build ID from HTML"
              fi
            else
              echo "  ERROR: Could not fetch HTML to determine build ID"
            fi
            
            # Save PM2 configuration
            pm2 save
            
            # Setup PM2 to start on system boot
            pm2 startup || true
            
            # Get absolute paths
            ABS_APP_DIR="$(cd "$APP_DIR" && pwd)"
            
            # Update nginx config with proxy to port 4001
            SITE_CONF="/etc/nginx/sites-available/sphynx-ir"
            SITE_LINK="/etc/nginx/sites-enabled/sphynx-ir"
            
            echo "Creating/updating nginx config to proxy to port $APP_PORT"
            
            # Check if SSL certificates exist
            SSL_CERT="/etc/letsencrypt/live/sphynx.ir/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/sphynx.ir/privkey.pem"
            HAS_SSL=false
            
            if [ -f "$SSL_CERT" ] && [ -f "$SSL_KEY" ]; then
              HAS_SSL=true
              echo "SSL certificates found, configuring HTTPS"
            else
              echo "SSL certificates not found, configuring HTTP only"
              echo "To enable HTTPS later, run: sudo certbot certonly --nginx -d sphynx.ir -d www.sphynx.ir"
            fi
            
            # Verify the app is running on the correct port
            echo "Verifying application is running on port $APP_PORT..."
            if command -v ss >/dev/null 2>&1; then
              ss -tlnp | grep ":$APP_PORT " || echo "WARNING: Port $APP_PORT is not listening"
            elif command -v netstat >/dev/null 2>&1; then
              netstat -tlnp | grep ":$APP_PORT " || echo "WARNING: Port $APP_PORT is not listening"
            fi

            # Create nginx config based on SSL availability
            if [ "$HAS_SSL" = true ]; then
              $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name sphynx.ir www.sphynx.ir;
                return 301 https://\$host\$request_uri;
            }
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name sphynx.ir www.sphynx.ir;
                ssl_certificate ${SSL_CERT};
                ssl_certificate_key ${SSL_KEY};
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
                ssl_prefer_server_ciphers off;
                # Proxy to Next.js app on port 4001
                location / {
                    proxy_pass http://127.0.0.1:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                    # Timeouts
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF
            else
              $SUDO tee "$SITE_CONF" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name sphynx.ir www.sphynx.ir;
                # Proxy to Next.js app on port 4001
                location / {
                    proxy_pass http://127.0.0.1:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_cache_bypass \$http_upgrade;
                    # Timeouts
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/css application/javascript application/json
                           text/plain text/xml text/javascript
                           application/x-javascript application/xml+rss;
            }
            EOF
            fi
            
            # Remove leading whitespace from nginx config (12 spaces from heredoc indentation)
            $SUDO sed -i 's/^            //' "$SITE_CONF"

            # Enable the site
            $SUDO ln -sf "$SITE_CONF" "$SITE_LINK"
            
            echo "Nginx config created/updated. Proxying to port $APP_PORT"
            
            # Verify nginx config content
            echo "=== Nginx config for sphynx.ir ==="
            $SUDO cat "$SITE_CONF" | grep -A 5 "server_name sphynx.ir" || true
            
            # Check for conflicting server blocks
            echo "=== Checking for other nginx server blocks ==="
            $SUDO grep -r "server_name" /etc/nginx/sites-enabled/ 2>/dev/null | grep -v "sphynx.ir" || true
            
            # Verify which ports are being used
            echo "=== Checking active nginx server blocks ==="
            $SUDO nginx -T 2>/dev/null | grep -E "(server_name|listen|proxy_pass)" | head -30 || true
            
            # Before testing nginx, check and fix other configs with missing SSL certs
            echo "Checking for nginx configs with missing SSL certificates..."
            
            # Find all enabled nginx configs (except ours)
            for config_file in /etc/nginx/sites-enabled/*; do
              if [ -f "$config_file" ] && [ "$(basename "$config_file")" != "sphynx-ir" ]; then
                # Check if config references SSL certs that don't exist
                if grep -q "ssl_certificate" "$config_file" 2>/dev/null; then
                  SSL_CERT_PATH=$(grep "ssl_certificate" "$config_file" | head -1 | awk '{print $2}' | tr -d ';' || true)
                  if [ -n "$SSL_CERT_PATH" ] && [ ! -f "$SSL_CERT_PATH" ]; then
                    echo "WARNING: Found config with missing SSL cert: $config_file"
                    echo "Temporarily disabling to allow nginx to start..."
                    $SUDO rm -f "$config_file"
                    echo "Disabled: $config_file"
                  fi
                fi
              fi
            done
            
            # Test nginx config - handle errors from other configs gracefully
            # Other sites might have missing SSL certs (now disabled above)
            echo "Testing nginx configuration..."
            if $SUDO nginx -t 2>&1 | tee /tmp/nginx-test.log; then
              echo "✓ Nginx config test passed"
            else
              # Check if the error is about our config or another config
              if grep -q "sphynx.ir" /tmp/nginx-test.log; then
                echo "ERROR: nginx config test failed for sphynx.ir!"
                cat /tmp/nginx-test.log
                exit 1
              else
                echo "WARNING: nginx config test failed, but error is not related to sphynx.ir"
                echo "This might be due to other site configs with missing SSL certificates"
                echo "Our sphynx.ir config should still work. Continuing..."
                cat /tmp/nginx-test.log || true
              fi
            fi
            
            # Check for default_server directives that might interfere
            echo "=== Checking for default_server directives ==="
            $SUDO grep -r "default_server" /etc/nginx/sites-enabled/ 2>/dev/null || echo "No default_server found"
            
            # Ensure no default server block is catching sphynx.ir
            echo "=== Verifying server_name matching ==="
            $SUDO nginx -T 2>/dev/null | grep -B 2 -A 10 "server_name.*sphynx.ir" || echo "Could not find sphynx.ir server block"
            
            # Reload nginx to apply changes
            if command -v nginx >/dev/null 2>&1; then
              if command -v systemctl >/dev/null 2>&1; then
                if $SUDO systemctl reload nginx 2>&1 || $SUDO systemctl restart nginx 2>&1; then
                  echo "✓ Nginx reloaded/restarted successfully"
                  
                  # Now attempt to obtain SSL certificates if they don't exist
                  if [ "$HAS_SSL" = false ]; then
                    echo "Attempting to obtain SSL certificates for sphynx.ir..."
                    echo "This requires:"
                    echo "  1. Domain DNS pointing to this server (62.60.210.188)"
                    echo "  2. Port 80 accessible from internet"
                    echo "  3. No rate limiting from Let's Encrypt"
                    
                    # Use certbot with nginx plugin to automatically configure SSL
                    # --non-interactive: Don't prompt for user input
                    # --agree-tos: Agree to terms of service
                    # --email: Use a default email (can be overridden with environment variable)
                    # --redirect: Automatically redirect HTTP to HTTPS
                    # --keep-until-expiring: Keep existing certs if they exist
                    if $SUDO certbot --nginx \
                      --non-interactive \
                      --agree-tos \
                      --email admin@sphynx.ir \
                      --redirect \
                      --keep-until-expiring \
                      -d sphynx.ir \
                      -d www.sphynx.ir 2>&1; then
                      echo "✓ SSL certificates obtained and configured successfully"
                      HAS_SSL=true
                      
                      # Verify certificates exist
                      if [ -f "$SSL_CERT" ] && [ -f "$SSL_KEY" ]; then
                        echo "✓ SSL certificates verified: $SSL_CERT"
                        
                        # Reload nginx to apply SSL configuration
                        $SUDO systemctl reload nginx || $SUDO systemctl restart nginx || true
                        echo "✓ Nginx reloaded with SSL configuration"
                      else
                        echo "WARNING: Certificates were created but not found at expected location"
                      fi
                    else
                      echo "WARNING: Failed to obtain SSL certificates"
                      echo "This might be due to:"
                      echo "  - Domain DNS not pointing to this server (check: dig sphynx.ir)"
                      echo "  - Port 80 not accessible from internet"
                      echo "  - Rate limiting from Let's Encrypt (try again later)"
                      echo "  - Cloudflare proxy blocking Let's Encrypt validation"
                      echo ""
                      echo "Continuing with HTTP-only configuration..."
                      echo "You can manually obtain certificates later with:"
                      echo "  sudo certbot --nginx -d sphynx.ir -d www.sphynx.ir"
                    fi
                  fi
                else
                  echo "WARNING: Could not reload/restart nginx"
                fi
              else
                $SUDO nginx -s reload || $SUDO service nginx reload || true
                echo "Nginx reloaded"
              fi
            fi
            
            # Verify PM2 is running
            echo "=== PM2 Status ==="
            pm2 status
            pm2 info nooshland || true
            
            # Show PM2 logs (last 20 lines)
            echo "=== Recent PM2 Logs ==="
            pm2 logs nooshland --lines 20 --nostream || true
            
            # Verify static assets are accessible
            echo "=== Testing Static Assets ==="
            echo "Testing if server can serve static assets..."
            sleep 3  # Give server time to fully start
            
            # Test if the server responds
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT/ 2>/dev/null | grep -q "200"; then
              echo "✓ Server is responding on port $APP_PORT"
            else
              echo "WARNING: Server might not be responding correctly"
            fi
            
            # Test if we can access the actual HTML and check for static file references
            echo "Fetching homepage HTML to check static file paths..."
            HOME_HTML=$(curl -s http://localhost:$APP_PORT/ 2>/dev/null || echo "")
            if [ -n "$HOME_HTML" ]; then
              echo "✓ Homepage HTML retrieved (${#HOME_HTML} bytes)"
              
              # Check if HTML references static files
              if echo "$HOME_HTML" | grep -q "_next/static"; then
                echo "✓ HTML contains references to _next/static files"
                
                # Extract a static file path from HTML
                STATIC_FILE_PATH=$(echo "$HOME_HTML" | grep -o '_next/static/[^"]*' | head -1 || true)
                if [ -n "$STATIC_FILE_PATH" ]; then
                  echo "  Found static file reference: $STATIC_FILE_PATH"
                  
                  # Test if this file is accessible
                  STATIC_FILE_TEST=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$APP_PORT/$STATIC_FILE_PATH" 2>/dev/null || echo "000")
                  echo "  Static file accessibility test: HTTP $STATIC_FILE_TEST"
                  
                  if [ "$STATIC_FILE_TEST" = "200" ]; then
                    echo "✓ Static file is accessible - CSS/JS should load correctly"
                  else
                    echo "ERROR: Static file is NOT accessible (HTTP $STATIC_FILE_TEST)"
                    echo "This will cause CSS/JS not to load!"
                    echo ""
                    echo "Checking if file exists on disk..."
                    # Convert URL path to filesystem path
                    FS_PATH="$STATIC_DIR/${STATIC_FILE_PATH#_next/static/}"
                    if [ -f "$FS_PATH" ]; then
                      echo "  File exists on disk: $FS_PATH"
                      echo "  But server cannot serve it - this is a Next.js server issue"
                    else
                      echo "  File does NOT exist on disk: $FS_PATH"
                      echo "  Expected location: $STATIC_DIR"
                      ls -la "$STATIC_DIR" | head -10 || true
                    fi
                  fi
                fi
              else
                echo "WARNING: HTML does not contain _next/static references"
              fi
            else
              echo "ERROR: Could not retrieve homepage HTML"
            fi
            
            # Verify directory structure one more time
            echo "=== Final Directory Structure Check ==="
            echo "Static directory: $STATIC_DIR"
            if [ -d "$STATIC_DIR" ]; then
              echo "✓ Static directory exists"
              STATIC_FILE_COUNT=$(find "$STATIC_DIR" -type f | wc -l)
              echo "  Total static files: $STATIC_FILE_COUNT"
              echo "  Sample files:"
              find "$STATIC_DIR" -type f | head -5 || true
            else
              echo "ERROR: Static directory missing!"
            fi
            
            # Verify the app is listening on port 4001
            echo "=== Port Check ==="
            if command -v netstat >/dev/null 2>&1; then
              netstat -tlnp | grep ":$APP_PORT " || echo "Port $APP_PORT not found in netstat"
            elif command -v ss >/dev/null 2>&1; then
              ss -tlnp | grep ":$APP_PORT " || echo "Port $APP_PORT not found in ss"
            else
              echo "Cannot check port status (netstat/ss not available)"
            fi
            
            echo "=== Deployment Complete ==="
            echo "Application should be running on port $APP_PORT"
            echo "Nginx should be proxying sphynx.ir to localhost:$APP_PORT"
            echo ""
            echo "=== Performance Optimizations Active ==="
            echo "✓ Standalone mode enabled (minimal footprint, no npm install)"
            echo "✓ Source maps disabled (productionSourceMaps: false)"
            echo "✓ Image optimization disabled (images.unoptimized: true)"
            echo "✓ PM2 memory limit: 400MB (auto-restart on exceed)"
            echo "✓ Direct node execution (no npm overhead)"
            echo "✓ Build done on GitHub runners (not on server)"
            echo ""
            echo "Monitor memory usage: pm2 monit"
            echo "View logs: pm2 logs nooshland"
